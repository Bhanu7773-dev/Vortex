name: vortex
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  permission_handler: ^12.0.1
  disk_space_2: ^1.0.12
  intl: ^0.20.2
  video_thumbnail: ^0.5.3
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  video_player: ^2.9.2
  chewie: ^1.9.0
  audioplayers: ^6.1.1
  open_filex: ^4.5.1
  web_socket_channel: ^2.4.0
  uuid: ^4.3.3
  device_info_plus: ^11.3.0
  network_info_plus: ^6.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  android_intent_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/vortex-icon-dark.png"
  adaptive_icon_foreground: "assets/vortex-icon-dark.png"
  adaptive_icon_background: "#00000000"
  min_sdk_android: 21
  remove_alpha_ios: false
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/vortex-icon-dark.png"
  macos:
    generate: false
  linux:
    generate: true
    image_path: "assets/vortex-icon-dark.png"

flutter:
  uses-material-design: true

  assets:
    - assets/vortex-icon-dark.png

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
